<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mini Social</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1 class="logo">Mini Social</h1>
</header>

<main class="feed">

  <article class="post">
    <div class="post-header">
      <img src="assets/perfil-isabele.jpg" class="avatar">
      <div>
        <span class="name">Belle Dev</span>
        <span class="username">@belbel</span>
      </div>
    </div>

    <p class="post-text">
      A vida é bem mas legal, quando vc n liga para os outros
    </p>

    <div class="post-actions">
      <button id="likeBtn">Curtir</button>
      <span id="likeCount">0</span>
    </div>
<div class="post-actions">
  <button id="likeBtn">Deslike</button>
  <span id="likeCount">0</span>
</div>


    <section class="comments">
      <div class="comment">
        <img src="assets/avatar.png" class="avatar-small">
        <p> KSKSKS, PROFUNDO. </p>
      </div>

      <div class="comment">
        <img src="assets/avatar.png" class="avatar-small">
        <p> EU TE AMO AMOR! -KEHT </p>
      </div>
    </section>

  </article>

</main>

<script src="js/script.js"></script>
</body>
</html>
